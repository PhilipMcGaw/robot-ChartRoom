site_name: Chartroom
site_description: Engineering knowledge base for the Robots project
site_url: https://chartroom.philipmcgaw.com/

# Keep the site machine-readable as well as human-readable. The override adds
# page metadata and Schema.org JSON-LD to the generated HTML.
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed

nav:
  - Home: index.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Communications: architecture/communications.md
      - NATS: architecture/nats.md
      - Robot Profiles: architecture/robot-profiles.md
  - Robots:
      - CuttleOS: cuttleos/index.md
      - Cockpit: cockpit/index.md
      - DataLogger: datalogger/index.md
  - Simulation & Test:
      - HIL & SiL: hil-sil/index.md
      - ROS 2:
          - Overview: ros2/index.md
          - Course: ros2/course/index.md
          - Workstation Setup: ros2/course/00-workstation.md
          - NATS Core Networking: ros2/course/01-nats-networking.md
          - Robot Description: ros2/course/02-robot-description.md
          - ROS 2 Fundamentals: ros2/course/03-ros2-fundamentals.md
          - Gazebo: ros2/course/04-gazebo.md
          - Vehicle Model: ros2/course/05-vehicle-model.md
          - Sensors and Camera: ros2/course/06-sensors-and-camera.md
          - NATS ↔ ROS 2 Bridge: ros2/course/07-nats-ros2-bridge.md
          - HiL & SiL Scenarios: ros2/course/08-hil-sil-scenarios.md
          - Testbot: ros2/course/09-testbot-physical-to-ros2.md
      - Gazebo: ros2/gazebo.md
  - Development:
      - Development Environment: development/environment.md
      - Testing: development/testing.md
      - Deployment: development/deployment.md
  - Tutorials:
      - Overview: tutorials/index.md
  - Engineering Decisions:
      - Overview: decisions/index.md
  - Roadmap: roadmap.md
